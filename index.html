<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Generate share-ready lyrics cards from your favorite songs.">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/wizard.css">
    <link rel="stylesheet" href="styles/song-image.css">
    <title>LyricScard — share what your songs say</title>
</head>

<body class="dark-mode">
    <div class="bg-blob" aria-hidden="true">
        <span class="blob blob-a"></span>
        <span class="blob blob-b"></span>
        <span class="blob blob-c"></span>
    </div>

    <main>
        <section class="lyrics-image-screen search-form" data-number="1">
            <div class="screen-wrapper">
                <header class="brand-header">
                    <div class="brand">
                        <span class="brand-glyph material-symbols-outlined" aria-hidden="true">graphic_eq</span>
                        <h1>LyricScard</h1>
                    </div>
                    <p class="tagline">Turn the lines that hit hardest into a card you can share.</p>
                </header>

                <form class="search-card">
                    <label class="visually-hidden" for="song-name">Song name and artist</label>
                    <input class="search-input" type="text" id="song-name" autocomplete="off"
                        placeholder="Song name and artist…">
                    <button class="btn-primary" id="search" data-noise-button>
                        <span class="material-symbols-outlined" aria-hidden="true">search</span>
                        <span>Find that song</span>
                    </button>
                </form>

                <div class="searching hidden" aria-live="polite"></div>
                <div class="error hidden" role="alert"></div>
            </div>
        </section>

        <section class="lyrics-image-screen hidden search-results" data-number="2">
            <div class="screen-wrapper">
                <header class="screen-header">
                    <button class="icon-btn go-to-screen material-symbols-outlined" data-number="1" aria-label="Back">
                        chevron_left
                    </button>
                    <h2>Pick the right one</h2>
                    <span class="header-spacer" aria-hidden="true"></span>
                </header>

                <div class="song-selection">
                    <div class="select-song cloneable">
                        <div class="cover-frame">
                            <img src="" alt="">
                        </div>
                        <div class="name"></div>
                        <div class="authors"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="lyrics-image-screen hidden lyrics-results" data-number="3">
            <div class="screen-wrapper">
                <header class="screen-header">
                    <button class="icon-btn go-to-screen material-symbols-outlined" data-number="2" aria-label="Back">
                        chevron_left
                    </button>
                    <h2>Choose the lines</h2>
                    <button class="icon-btn go-to-screen right material-symbols-outlined" data-number="4"
                        aria-label="Continue">
                        chevron_right
                    </button>
                </header>

                <div class="song-info-display">
                    <img src="" alt="" class="song-info-cover">
                    <div class="song-info-text">
                        <div class="song-info-name"></div>
                        <div class="song-info-artist"></div>
                    </div>
                </div>

                <div class="searching hidden" aria-live="polite"></div>
                <div class="lines-selection"></div>
            </div>

            <button class="fab hidden" id="lyrics-fab" aria-label="Continue with selected lines"
                data-noise-button>
                <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                <span class="fab-label">Make card</span>
            </button>
        </section>

        <section class="lyrics-image-screen hidden final-options" data-number="4">
            <div class="screen-wrapper">
                <header class="screen-header">
                    <button class="icon-btn material-symbols-outlined" id="last-go-back" aria-label="Back">
                        chevron_left
                    </button>
                    <h2>Tune your card</h2>
                    <div class="header-actions">
                        <button class="icon-btn material-symbols-outlined" id="share" aria-label="Share card">
                            ios_share
                        </button>
                        <button class="icon-btn material-symbols-outlined" id="download" aria-label="Download card">
                            download
                        </button>
                    </div>
                </header>

                <div class="searching hidden" aria-live="polite"></div>

                <div class="card-stage">
                    <div class="song-image">
                        <div class="header">
                            <img src="" alt="">
                            <div>
                                <div class="name" contenteditable spellcheck="false"></div>
                                <div class="authors" contenteditable spellcheck="false"></div>
                            </div>
                        </div>
                        <div class="lyrics" contenteditable="true" spellcheck="false"></div>
                        <div class="brand-logo spotify-logo">
                            <img src="" alt="Spotify">
                        </div>
                        <div class="brand-logo apple-music-logo" aria-label="Apple Music">
                            <img class="apple-glyph" src="" alt="">
                            <span class="apple-wordmark">Music</span>
                        </div>
                    </div>
                </div>

                <div class="control-panel">
                    <div class="control-group style-group">
                        <div class="control-label">Card style</div>
                        <div class="style-selection" role="radiogroup" aria-label="Card style">
                            <button type="button" class="style-option selected" data-style="spotify"
                                role="radio" aria-checked="true">
                                <span class="style-glyph spotify-glyph" aria-hidden="true">
                                    <svg viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="84" cy="84" r="84" fill="#1ED760"/>
                                        <path fill="#000" d="M122.6 117.7c-1.6 2.6-5 3.4-7.6 1.8-20.8-12.7-47-15.6-77.8-8.6-3 .7-6-1.2-6.7-4.2-.7-3 1.2-6 4.2-6.7 33.7-7.7 62.6-4.4 86 9.9 2.6 1.6 3.4 5.1 1.9 7.8zm10.4-22.2c-2 3.2-6.2 4.2-9.4 2.2-23.8-14.6-60.1-18.8-88.2-10.3-3.6 1.1-7.4-.9-8.5-4.5-1.1-3.6.9-7.4 4.5-8.5 32.2-9.8 72.2-5.1 99.5 11.7 3.2 2 4.2 6.2 2.2 9.4zm.9-23.1C105.3 55.7 57.5 53.9 31 62.4c-4.3 1.3-8.9-1.1-10.2-5.4-1.3-4.3 1.1-8.9 5.4-10.2 30.5-9.3 83.3-7.2 116.1 12.4 3.9 2.3 5.2 7.4 2.9 11.3-2.3 3.9-7.4 5.2-11.3 2.9z"/>
                                    </svg>
                                </span>
                                <span>Spotify</span>
                            </button>
                            <button type="button" class="style-option" data-style="apple-music"
                                role="radio" aria-checked="false">
                                <span class="style-glyph apple-music-glyph" aria-hidden="true">
                                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="">
                                </span>
                                <span>Apple Music</span>
                            </button>
                        </div>
                    </div>

                    <div class="control-group color-group">
                        <div class="control-label">Background</div>
                        <div class="color-selection" role="radiogroup" aria-label="Card background color">
                            <div id="custom-color">
                                <input type="color" id="custom-color-input">
                                <label class="material-symbols-outlined" for="custom-color-input"
                                    aria-label="Custom color">palette</label>
                            </div>
                        </div>
                    </div>

                    <div class="control-group toggle-group">
                        <div class="switch-container" id="light-text">
                            <div class="switch" role="switch" aria-checked="false" tabindex="0"></div>
                            <div>Light text</div>
                        </div>
                        <div class="switch-container" id="spotify-tag">
                            <div class="switch" role="switch" aria-checked="false" tabindex="0"></div>
                            <div>Add logo</div>
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="width-control">
                            <div>
                                <label for="width-slider">Width</label>
                                <span id="width-value">320px</span>
                            </div>
                            <input type="range" id="width-slider" min="200" max="600" value="320" step="10">
                        </div>
                    </div>

                    <div class="control-group font-selection-container">
                        <label class="font-label" for="font-lang">Glyph standard</label>
                        <select id="font-lang">
                            <option value="en">Auto</option>
                            <option value="zh-TW">Traditional (TW)</option>
                            <option value="zh-CN">Simplified (CN)</option>
                            <option value="zh-HK">Cantonese (HK)</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="footer-credits">
            Made by
            <a href="https://prancingunicorn.pages.dev" target="_blank" rel="noopener">Optimus</a>
        </div>
        <button id="dark-mode-toggle" type="button" aria-label="Toggle theme">
            <span class="material-symbols-outlined" aria-hidden="true"></span>
            <span class="theme-label"></span>
        </button>
    </footer>

    <script src="classes/data/Artist.js"></script>
    <script src="classes/data/Lyric.js"></script>
    <script src="classes/data/Song.js"></script>
    <script src="classes/DataFetcher.js"></script>
    <script src="classes/NoiseButton.js"></script>
    <script src="classes/DOMHandler.js"></script>
    <script src="index.js"></script>
</body>

</html>
